name: Qt Cross Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            qt_arch: gcc_64
            platform_name: Linux-x64
            arch_label: x86_64
            build_dir: build-linux-x64
            artifact_name: DrCOM-JLU-Linux-x64.tar.gz
            is_linux: true

          # Linux ARM64
          - os: ubuntu-latest
            qt_arch: gcc_64
            platform_name: Linux-ARM64
            arch_label: aarch64
            build_dir: build-linux-arm64
            artifact_name: DrCOM-JLU-Linux-ARM64.tar.gz
            is_linux: true

          # Windows MinGW
          - os: windows-latest
            qt_arch: win64_mingw
            compiler: mingw
            platform_name: Windows-MinGW
            arch_label: x86_64
            build_dir: build-windows-mingw
            artifact_name: DrCOM-JLU-Windows-MinGW.zip
            is_windows: true
            deploy_dir: deploy-windows-mingw

          # Windows MSVC
          - os: windows-latest
            qt_arch: win64_msvc2019_64
            compiler: msvc
            platform_name: Windows-MSVC
            arch_label: x86_64
            build_dir: build-windows-msvc
            artifact_name: DrCOM-JLU-Windows-MSVC.zip
            is_windows: true
            deploy_dir: deploy-windows-msvc

          # macOS Intel
          - os: macos-13
            qt_arch: clang_64
            mac_arch: x86_64
            platform_name: macOS-Intel
            arch_label: x86_64
            build_dir: build-macos-intel
            artifact_name: DrCOM-JLU-macOS-Intel.zip
            is_macos: true

          # macOS Apple Silicon
          - os: macos-latest
            qt_arch: clang_64
            mac_arch: arm64
            platform_name: macOS-AppleSilicon
            arch_label: arm64
            build_dir: build-macos-arm64
            artifact_name: DrCOM-JLU-macOS-AppleSilicon.zip
            is_macos: true

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        arch: ${{ matrix.qt_arch }}
        host: ${{ matrix.is_macos && 'mac' || matrix.is_windows && 'windows' || 'linux' }}
        cache: true

    - name: Setup MSYS2 for MinGW
      if: matrix.compiler == 'mingw'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-make
        update: true

    - name: Setup MSVC Environment
      if: matrix.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        uwp: false
        spectre: false

    - name: Create Build Directory
      shell: bash
      run: |
        mkdir -p "${{ matrix.build_dir }}"

    - name: Configure (qmake)
      shell: bash
      working-directory: ${{ matrix.build_dir }}
      run: |
        if [ -n "${{ matrix.mac_arch }}" ]; then
          qmake ../DrCOM_JLU_Qt.pro CONFIG+=release "QMAKE_APPLE_DEVICE_ARCHS=${{ matrix.mac_arch }}"
        else
          qmake ../DrCOM_JLU_Qt.pro CONFIG+=release
        fi

    - name: Build
      shell: bash
      working-directory: ${{ matrix.build_dir }}
      run: |
        if [ "${{ matrix.compiler }}" == "msvc" ]; then
          # MSVC 构建必须在 cmd 环境中运行
          echo "正在使用 MSVC 构建..."
          
          # 检查链接器
          echo "链接器路径:"
          which link || echo "link 命令不存在"
          
          # 设置 MSVC 工具链路径
          export PATH="/c/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64:$PATH"
          export PATH="/c/Program Files (x86)/Microsoft Visual Studio/2019/Enterprise/VC/Tools/MSVC/14.29.30133/bin/Hostx64/x64:$PATH"
          
          # 使用 cmd 调用 nmake
          cmd /c "nmake"
        elif [ "${{ runner.os }}" == "Windows" ] && [ "${{ matrix.compiler }}" == "mingw" ]; then
          mingw32-make -j$(nproc)
        else
          make -j$(nproc)
        fi

    - name: Verify Build Output
      shell: bash
      run: |
        echo "=== 验证 ${{ matrix.build_dir }} 目录 ==="
        ls -la "${{ matrix.build_dir }}/"
        
        if [ "${{ matrix.is_macos }}" == "true" ]; then
          if [ -d "${{ matrix.build_dir }}/DrCOM_JLU_Qt.app" ]; then
            file "${{ matrix.build_dir }}/DrCOM_JLU_Qt.app/Contents/MacOS/DrCOM_JLU_Qt"
            echo "✅ 找到 macOS 应用包"
          else
            echo "❌ 未找到 DrCOM_JLU_Qt.app"
            exit 1
          fi
        elif [ "${{ matrix.is_linux }}" == "true" ]; then
          if [ -f "${{ matrix.build_dir }}/DrCOM_JLU_Qt" ]; then
            file "${{ matrix.build_dir }}/DrCOM_JLU_Qt"
            echo "✅ 找到 Linux 可执行文件"
          else
            echo "❌ 未找到 DrCOM_JLU_Qt"
            exit 1
          fi
        elif [ "${{ matrix.is_windows }}" == "true" ]; then
          # Windows 构建输出可能在 release 子目录
          if [ -f "${{ matrix.build_dir }}/release/DrCOM_JLU_Qt.exe" ]; then
            echo "✅ 找到 Windows 可执行文件 (在 release 目录)"
            ls -la "${{ matrix.build_dir }}/release/"
          elif [ -f "${{ matrix.build_dir }}/DrCOM_JLU_Qt.exe" ]; then
            echo "✅ 找到 Windows 可执行文件"
          else
            echo "❌ 未找到 DrCOM_JLU_Qt.exe"
            find "${{ matrix.build_dir }}" -name "*.exe" -type f
            exit 1
          fi
        fi

    # 🔥 新增：Windows 依赖部署
    - name: Deploy Windows Dependencies
      if: matrix.is_windows
      shell: bash
      run: |
        echo "=== 部署 Windows 依赖 ==="
        
        # 创建部署目录
        DEPLOY_DIR="${{ matrix.deploy_dir }}"
        mkdir -p "$DEPLOY_DIR"
        
        # 查找可执行文件
        EXE_PATH=""
        if [ -f "${{ matrix.build_dir }}/release/DrCOM_JLU_Qt.exe" ]; then
          EXE_PATH="${{ matrix.build_dir }}/release/DrCOM_JLU_Qt.exe"
        elif [ -f "${{ matrix.build_dir }}/DrCOM_JLU_Qt.exe" ]; then
          EXE_PATH="${{ matrix.build_dir }}/DrCOM_JLU_Qt.exe"
        else
          # 尝试查找
          EXE_PATH=$(find "${{ matrix.build_dir }}" -name "*.exe" -type f | head -1)
        fi
        
        if [ -f "$EXE_PATH" ]; then
          echo "找到可执行文件: $EXE_PATH"
          cp "$EXE_PATH" "$DEPLOY_DIR/"
        else
          echo "❌ 错误：未找到可执行文件"
          exit 1
        fi
        
        # 运行 windeployqt 收集依赖
        echo "运行 windeployqt..."
        cd "$DEPLOY_DIR"
        
        EXE_FILE=$(find . -name "*.exe" -type f | head -1)
        if [ -n "$EXE_FILE" ]; then
          echo "为 $EXE_FILE 部署依赖..."
          windeployqt --compiler-runtime --no-translations "$EXE_FILE"
          
          echo "=== 部署目录内容 ==="
          ls -la
        else
          echo "❌ 错误：部署目录中未找到可执行文件"
          exit 1
        fi

    - name: Deploy macOS Dependencies
      if: matrix.is_macos
      shell: bash
      run: |
        echo "=== 部署 macOS 依赖 ==="
        
        if [ -d "${{ matrix.build_dir }}/DrCOM_JLU_Qt.app" ]; then
          APP_PATH="${{ matrix.build_dir }}/DrCOM_JLU_Qt.app"
        else
          APP_PATH=$(find "${{ matrix.build_dir }}" -name "*.app" -type d | head -1)
        fi
        
        if [ -d "$APP_PATH" ]; then
          echo "找到应用包: $APP_PATH"
          macdeployqt "$APP_PATH" -always-overwrite
        else
          echo "❌ 错误：未找到 .app 文件"
          exit 1
        fi

    - name: Package Linux
      if: matrix.is_linux
      shell: bash
      run: |
        if [ -f "${{ matrix.build_dir }}/DrCOM_JLU_Qt" ]; then
          tar czvf "${{ matrix.artifact_name }}" -C "${{ matrix.build_dir }}" DrCOM_JLU_Qt
        else
          echo "❌ 错误：未找到可执行文件"
          exit 1
        fi

    - name: Package Windows
      if: matrix.is_windows
      shell: bash
      run: |
        if [ -d "${{ matrix.deploy_dir }}" ]; then
          7z a "${{ matrix.artifact_name }}" "${{ matrix.deploy_dir }}/*"
        else
          echo "❌ 错误：部署目录不存在"
          exit 1
        fi

    - name: Package macOS
      if: matrix.is_macos
      shell: bash
      run: |
        if [ -d "${{ matrix.build_dir }}/DrCOM_JLU_Qt.app" ]; then
          APP_PATH="${{ matrix.build_dir }}/DrCOM_JLU_Qt.app"
        else
          APP_PATH=$(find "${{ matrix.build_dir }}" -name "*.app" -type d | head -1)
        fi
        
        if [ -d "$APP_PATH" ]; then
          ditto -c -k --keepParent "$APP_PATH" "${{ matrix.artifact_name }}"
        else
          echo "❌ 错误：未找到应用包"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}
        retention-days: 1

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
